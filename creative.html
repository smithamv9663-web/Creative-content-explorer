<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Creative Content Explorer</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5ff;
    color: #222;
}

.container {
    width: 92%;
    max-width: 1050px;
    margin: 35px auto;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    color: #2448c7;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 30px;
}

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.search-box input {
    flex: 1;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

.search-box button {
    width: 150px;
    margin: 0;
}

.mode {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.mode button {
    width: auto;
    padding: 10px 20px;
    margin: 0;
    background: #ddd;
    color: #222;
}

.mode button.active {
    background: #315bea;
    color: white;
}

button {
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #315bea;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #1e42c4;
}

#loading {
    display: none;
    text-align: center;
    padding: 20px;
    color: #315bea;
    font-weight: bold;
}

.results {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #ddd;
    box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.card-content {
    padding: 18px;
}

.card h3 {
    color: #2448c7;
    margin-top: 0;
}

.card p {
    color: #555;
    line-height: 1.5;
}

.details {
    display: none;
    margin-top: 30px;
    padding: 25px;
    background: #f7f9ff;
    border-radius: 15px;
}

.details img {
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: 12px;
}

.details h2 {
    color: #2448c7;
    margin-top: 20px;
}

.details h3 {
    color: #333;
    margin-top: 25px;
}

.details p {
    line-height: 1.7;
    color: #444;
}

.map-button {
    display: inline-block;
    padding: 12px 18px;
    background: #16803c;
    color: white;
    text-decoration: none;
    border-radius: 7px;
    margin-top: 10px;
}

.back-button {
    margin-top: 25px;
    background: #555;
}

.error {
    background: #fff0f0;
    padding: 20px;
    border-radius: 10px;
    color: #b00020;
}

</style>
</head>


<body>

<div class="container">

    <h1>Creative Content Explorer</h1>

    <p class="subtitle">
        Explore creative ideas and useful information about any topic or place.
    </p>


    <!-- Search Type -->

    <div class="mode">

        <button
            id="topicMode"
            class="active"
            onclick="setMode('topic')">

            Topic Search

        </button>


        <button
            id="placeMode"
            onclick="setMode('place')">

            Place Search

        </button>

    </div>


    <!-- Search -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search any topic..."
            onkeydown="if(event.key === 'Enter') searchContent()"
        >

        <button onclick="searchContent()">
            Search
        </button>

    </div>


    <div id="loading">
        Searching for information...
    </div>


    <div id="results" class="results"></div>


    <div id="details" class="details"></div>

</div>



<script>

let currentMode = "topic";


/* ==========================
   CHANGE SEARCH MODE
========================== */

function setMode(mode) {

    currentMode = mode;

    const topicMode =
        document.getElementById("topicMode");

    const placeMode =
        document.getElementById("placeMode");

    const input =
        document.getElementById("searchInput");


    if (mode === "topic") {

        topicMode.classList.add("active");

        placeMode.classList.remove("active");

        input.placeholder =
            "Search any topic...";

    }

    else {

        placeMode.classList.add("active");

        topicMode.classList.remove("active");

        input.placeholder =
            "Search any place...";
    }

}



/* ==========================
   MAIN SEARCH
========================== */

async function searchContent() {

    const query =
        document.getElementById("searchInput")
        .value
        .trim();


    const results =
        document.getElementById("results");

    const details =
        document.getElementById("details");

    const loading =
        document.getElementById("loading");


    if (query === "") {

        alert("Please enter something to search.");

        return;
    }


    results.innerHTML = "";

    details.style.display = "none";

    loading.style.display = "block";


    try {

        const url =
            "https://en.wikipedia.org/w/api.php" +

            "?action=query" +

            "&generator=search" +

            "&gsrsearch=" +
            encodeURIComponent(query) +

            "&gsrlimit=8" +

            "&prop=pageimages|extracts" +

            "&exintro=true" +

            "&explaintext=true" +

            "&piprop=thumbnail" +

            "&pithumbsize=700" +

            "&format=json" +

            "&origin=*";


        const response =
            await fetch(url);


        const data =
            await response.json();


        loading.style.display = "none";


        if (
            !data.query ||
            !data.query.pages
        ) {

            results.innerHTML = `

                <div class="error">

                    No information found for
                    <b>${query}</b>.

                    Try another spelling or keyword.

                </div>

            `;

            return;
        }


        const pages =
            Object.values(data.query.pages);


        pages.forEach(page => {

            createCard(page, query);

        });

    }


    catch (error) {

        loading.style.display = "none";


        results.innerHTML = `

            <div class="error">

                Unable to get information.

                Please check your internet connection
                and try again.

            </div>

        `;

        console.log(error);

    }

}



/* ==========================
   CREATE RESULT CARD
========================== */

function createCard(page, query) {

    const results =
        document.getElementById("results");


    const card =
        document.createElement("div");


    card.className = "card";


    let image =
        "https://via.placeholder.com/700x400?text=No+Image";


    if (
        page.thumbnail &&
        page.thumbnail.source
    ) {

        image =
            page.thumbnail.source;

    }


    const description =
        page.extract ||
        "Information about " + page.title;


    card.innerHTML = `

        <img
            src="${image}"
            alt="${page.title}"
        >

        <div class="card-content">

            <h3>
                ${page.title}
            </h3>

            <p>
                ${description.substring(0, 180)}...
            </p>

            <b>
                Click to explore →
            </b>

        </div>

    `;


    card.onclick = function() {

        showDetails(
            page,
            query,
            image
        );

    };


    results.appendChild(card);

}



/* ==========================
   SHOW FULL DETAILS
========================== */

function showDetails(
    page,
    query,
    image
) {

    const details =
        document.getElementById("details");


    const text =
        page.extract ||
        "Information is not available.";


    const mapURL =
        "https://www.google.com/maps/search/?api=1&query=" +
        encodeURIComponent(page.title);


    details.innerHTML = `

        <img
            src="${image}"
            alt="${page.title}"
        >


        <h2>
            ${page.title}
        </h2>


        <h3>
            About
        </h3>

        <p>
            ${text}
        </p>


        <h3>
            💡 Blog Ideas
        </h3>

        <p>

            • Introduction to ${page.title}<br>

            • Important Facts About ${page.title}<br>

            • Uses and Applications of ${page.title}<br>

            • Advantages and Disadvantages of ${page.title}<br>

            • Future of ${page.title}<br>

            • Interesting Facts About ${page.title}

        </p>


        <h3>
            🔍 Why This Topic Is Interesting
        </h3>

        <p>

            ${page.title} can be explored from
            different perspectives including its
            history, uses, importance, benefits,
            challenges and real-world applications.

        </p>


        ${
            currentMode === "place"

            ?

            `

            <h3>
                📍 Location & Route
            </h3>

            <p>
                Search this place on Google Maps
                to see its location and route.
            </p>


            <a
                class="map-button"
                href="${mapURL}"
                target="_blank"
            >

                Open in Google Maps

            </a>

            `

            :

            ""

        }


        <br>


        <button
            class="back-button"
            onclick="closeDetails()"
        >

            ← Back to Search Results

        </button>

    `;


    details.style.display = "block";


    details.scrollIntoView({
        behavior: "smooth"
    });

}



/* ==========================
   CLOSE DETAILS
========================== */

function closeDetails() {

    const details =
        document.getElementById("details");


    details.style.display = "none";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

</script>

</body>
</html>
